name: Maintenance report

# One weekly report across several repositories, kept in an issue here. Running it from a
# repository that stays active also avoids GitHub switching scheduled workflows off after 60
# days without activity in a quiet one.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report without writing any issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keepatch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
        with:
          dry_run: ${{ inputs.dry_run || 'false' }}
          # Public repositories to read. Add one per line.
          repos: |
            helenkwok/keepatch
            helenkwok/StochCraft
