name: Keepatch
description: A weekly maintenance report kept in issues - ranks failing checks, open pull requests, bug reports and stale pinned dependencies with fixed rules.
branding:
  icon: check-square
  color: purple
inputs:
  token:
    description: Token used to read repositories and to write issues in the repository running the workflow.
    default: ${{ github.token }}
  repos:
    description: Repositories to read, as owner/name separated by spaces or new lines. Defaults to the repository running the workflow. The report and task issues are always written there.
    default: ""
  dry_run:
    description: Print the report and what would be written, without writing any issue.
    default: "false"
runs:
  using: node24
  main: keepatch.mjs
