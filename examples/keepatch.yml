# Copy to .github/workflows/keepatch.yml in the repository to maintain.
name: Keepatch maintenance report

# It reads pull requests through the API only: it never checks out or runs their code, never
# pushes and never merges.
#
# GitHub turns scheduled workflows off after 60 days without repository activity; the report
# issue's "Updated" line shows whether this is still running.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report without writing any issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keepatch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      # Pin to a full commit SHA of a Keepatch release you have read.
      - uses: helenkwok/keepatch@COMMIT_SHA
        with:
          dry_run: ${{ inputs.dry_run || 'false' }}
